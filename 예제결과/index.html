<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작은 PR과 병합 검토</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:Pretendard,system-ui,sans-serif}.app{width:1180px;margin:32px auto;background:#fff;border:1px solid #dbe2ee;border-radius:20px;box-shadow:0 18px 60px #25345a1f;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;background:#132a4f;color:#fff}.brand{font-size:18px;font-weight:800}.meta{font-size:13px;color:#bfdbfe}.hero{padding:30px 34px 18px}.label{color:#4f46e5;font-size:13px;font-weight:800;letter-spacing:.08em}.hero h1{margin:8px 0 6px;font-size:34px;letter-spacing:-.03em}.hero p{margin:0;color:#64748b;font-size:16px}.tabs{display:flex;gap:8px;padding:18px 34px;border-bottom:1px solid #e5e7eb}.tab{padding:10px 16px;border-radius:9px;background:#eef2ff;color:#3730a3;font-weight:750}.tab:first-child{background:#4f46e5;color:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:22px 34px}.card{padding:18px;border:1px solid #dbe2ee;border-radius:14px;background:#fbfcff}.card b{display:block;margin-bottom:8px;color:#64748b;font-size:13px}.card strong{font-size:20px}.table{margin:0 34px 30px;border:1px solid #dbe2ee;border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:1.1fr 1.4fr 1.5fr 1fr;min-height:52px;align-items:center;border-top:1px solid #e5e7eb}.row:first-child{border-top:0;background:#eff3f9;color:#334155;font-weight:800}.row span{padding:0 16px}.status{display:inline-block;width:max-content;padding:5px 10px;border-radius:99px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.foot{display:flex;justify-content:space-between;padding:15px 34px;background:#f8fafc;color:#64748b;font-size:13px}</style></head><body><main class="app"><header class="top"><div class="brand">B팀 실습 결과 예시</div><div class="meta">더미·가상·공개 자료만 사용</div></header><section class="hero"><span class="label">ACTUAL OUTPUT</span><h1>작은 PR과 병합 검토</h1><p>기능·파일 소유권을 먼저 나누고 한 가지 목적의 변경을 검토한 결과</p></section><nav class="tabs"><span class="tab">Issue #12</span><span class="tab">PR #18</span><span class="tab">Merge 확인</span></nav><section class="cards"><article class="card"><b>변경 목적</b><strong>목록 상태 필터 추가</strong></article><article class="card"><b>변경 파일</b><strong>2개</strong></article><article class="card"><b>검증</b><strong>6개 테스트 통과</strong></article></section><section class="table"><div class="row"><span>구분</span><span>대상</span><span>확인 내용</span><span>상태</span></div><div class="row"><span>src/filter.js</span><span>데이터 담당</span><span>필터 로직</span><span class="status">검토완료</span></div><div class="row"><span>tests/filter.test.js</span><span>데이터 담당</span><span>회귀 테스트</span><span class="status">검토완료</span></div><div class="row"><span>src/index.js</span><span>공통 담당</span><span>연결 1줄</span><span class="status">합의완료</span></div></section><footer class="foot"><span>결과를 화면·파일·값·동작으로 직접 확인합니다.</span><span id="state">기본 결과 화면</span></footer></main><script>const alt=new URLSearchParams(location.search).get('state')==='2';if(alt){document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('tab',true));document.querySelectorAll('.tab').forEach(x=>{x.style.background='#eef2ff';x.style.color='#3730a3'});const t=document.querySelectorAll('.tab')[1]||document.querySelector('.tab');t.style.background='#4f46e5';t.style.color='#fff';document.querySelector('#state').textContent='확인·비교 화면';document.querySelectorAll('.row:not(:first-child)').forEach((x,i)=>{if(i%2===0)x.style.background='#f8fafc'})}</script></body></html>
