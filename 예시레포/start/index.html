<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가상 업무 요청 목록</title><style>
:root{--bg:#fafaf9;--surface:#fff;--text:#0a0a0a;--muted:#6b7280;--accent:#4f46e5;--border:#e5e7eb;--space:24px;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.6 system-ui,sans-serif}main{max-width:960px;margin:64px auto;padding:var(--space)}h1{font-size:36px;line-height:1.3}p{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:var(--space) 0}button{font:inherit;border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;background:var(--surface);cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{color:var(--muted);cursor:default}.primary{background:var(--accent);color:var(--surface)}table{width:100%;border-collapse:collapse;background:var(--surface)}th,td{text-align:left;padding:16px;border-bottom:1px solid var(--border)}#count{font-weight:700;color:var(--accent)}@media(max-width:600px){main{margin:16px auto}h1{font-size:28px}th,td{padding:8px;font-size:16px}}
</style></head><body><main><h1>가상 업무 요청 목록</h1><p>공개 교육용 가상 자료입니다. 실제 업무자료를 입력하지 않습니다.</p><div class="actions"><button id="all" class="primary" disabled>전체 보기</button><button id="open" disabled>미완료만 보기</button><button id="save" disabled>현재 목록 CSV 저장</button></div><p>현재 목록 <span id="count" aria-live="polite"></span></p><table><thead><tr><th>요청번호</th><th>업무</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table><p>원본 4건을 유지하면서 보기와 저장 기능을 나눠 개발합니다.</p></main><script src="data.js"></script><script src="app.js"></script><script src="export.js"></script></body></html>
